name: Furniture Hisab APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Extract project ZIP if present
        run: |
          mkdir -p extracted
          for z in *.zip; do
            [ -f "$z" ] && unzip -o "$z" -d extracted
          done

      - name: Apply ZFH 3D Icon + Instagram 5-Tab UI + Date-wise Hisab
        run: |
          PROJECT_DIR=$(dirname "$(find . -maxdepth 5 \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) | head -n 1)")
          APP_DIR="$PROJECT_DIR/app"
          find "$APP_DIR/src/main/res" -name "ic_launcher*" -delete
          pip install -q pillow || true
          python3 - "$APP_DIR/src/main/res" << 'PYICON'
          import os, sys, glob
          res_dir = sys.argv[1]
          candidates = [f for f in glob.glob("*.*") if f.lower().endswith((".png", ".jpg", ".jpeg", ".webp"))]
          candidates.sort(key=lambda x: (0 if "app_icon" in x.lower() else 1, -os.path.getsize(x)))
          if candidates:
              from PIL import Image
              im = Image.open(candidates[0]).convert("RGBA")
              w, h = im.size
              m = min(w, h)
              im = im.crop(((w - m) // 2, (h - m) // 2, (w + m) // 2, (h + m) // 2))
              for folder, sz in [("mipmap-mdpi", 48), ("mipmap-hdpi", 72), ("mipmap-xhdpi", 96), ("mipmap-xxhdpi", 144), ("mipmap-xxxhdpi", 192)]:
                  out_dir = os.path.join(res_dir, folder)
                  os.makedirs(out_dir, exist_ok=True)
                  resized = im.resize((sz, sz), Image.LANCZOS)
                  resized.save(os.path.join(out_dir, "ic_launcher.png"))
                  resized.save(os.path.join(out_dir, "ic_launcher_round.png"))
              print("Applied custom icon:", candidates[0])
          PYICON
          MANIFEST=$(find "$APP_DIR/src/main" -name "AndroidManifest.xml" | head -n 1)
          python3 - "$MANIFEST" << 'PYM'
          import sys, re
          p = sys.argv[1]
          s = open(p, encoding='utf-8').read()
          if 'android:icon=' in s:
              s = re.sub(r'android:icon="[^"]*"', 'android:icon="@mipmap/ic_launcher"', s)
          else:
              s = s.replace('<application', '<application android:icon="@mipmap/ic_launcher"')
          if 'android:roundIcon=' in s:
              s = re.sub(r'android:roundIcon="[^"]*"', 'android:roundIcon="@mipmap/ic_launcher_round"', s)
          else:
              s = s.replace('<application', '<application android:roundIcon="@mipmap/ic_launcher_round"')
          open(p, 'w', encoding='utf-8').write(s)
          PYM
          MAIN_KT=$(find "$APP_DIR/src/main" -name "MainActivity.kt" | head -n 1)
          cat << 'KTEOF' > "$MAIN_KT"
          package com.example.furniturehisab

          import android.app.Activity
          import android.app.AlertDialog
          import android.app.DatePickerDialog
          import android.app.KeyguardManager
          import android.content.ContentValues
          import android.content.Context
          import android.content.Intent
          import android.database.sqlite.SQLiteDatabase
          import android.database.sqlite.SQLiteOpenHelper
          import android.graphics.BitmapFactory
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.text.Editable
          import android.text.InputType
          import android.text.TextWatcher
          import android.util.Base64
          import android.view.Gravity
          import android.view.View
          import android.widget.*
          import androidx.activity.ComponentActivity
          import androidx.activity.result.contract.ActivityResultContracts
          import org.json.JSONArray
          import org.json.JSONObject
          import java.io.File
          import java.text.SimpleDateFormat
          import java.util.Calendar
          import java.util.Date
          import java.util.Locale

          data class Furniture(
              val id: Long, val model: String, val size: String, val amount: Double,
              val dateTime: String, val photo: String, val createdMs: Long
          )

          data class Payment(
              val id: Long, val amount: Double, val note: String, val dateTime: String, val createdMs: Long
          )

          class Db(context: Context) : SQLiteOpenHelper(context, "furniture.db", null, 4) {
              override fun onCreate(db: SQLiteDatabase) {
                  db.execSQL("CREATE TABLE items(id INTEGER PRIMARY KEY AUTOINCREMENT, model TEXT, size TEXT, amount REAL, dateTime TEXT, photo TEXT, createdMs INTEGER DEFAULT 0)")
                  db.execSQL("CREATE TABLE payments(id INTEGER PRIMARY KEY AUTOINCREMENT, amount REAL, note TEXT, dateTime TEXT, createdMs INTEGER DEFAULT 0)")
              }
              override fun onUpgrade(db: SQLiteDatabase, oldVersion: Int, newVersion: Int) {
                  db.execSQL("CREATE TABLE IF NOT EXISTS payments(id INTEGER PRIMARY KEY AUTOINCREMENT, amount REAL, note TEXT, dateTime TEXT, createdMs INTEGER DEFAULT 0)")
                  try { db.execSQL("ALTER TABLE items ADD COLUMN createdMs INTEGER DEFAULT 0") } catch (_: Exception) {}
                  try { db.execSQL("ALTER TABLE payments ADD COLUMN createdMs INTEGER DEFAULT 0") } catch (_: Exception) {}
              }
              fun all(): List<Furniture> {
                  val out = mutableListOf<Furniture>()
                  readableDatabase.rawQuery("SELECT id, model, size, amount, dateTime, photo, createdMs FROM items ORDER BY id DESC", null).use { c ->
                      while (c.moveToNext()) out.add(Furniture(c.getLong(0), c.getString(1) ?: "", c.getString(2) ?: "",
                          c.getDouble(3), c.getString(4) ?: "", c.getString(5) ?: "", c.getLong(6)))
                  }
                  return out
              }
              fun save(id: Long?, model: String, size: String, amount: Double, date: String, photo: String, ms: Long) {
                  val v = ContentValues().apply {
                      put("model", model); put("size", size); put("amount", amount)
                      put("dateTime", date); put("photo", photo); put("createdMs", ms)
                  }
                  if (id == null) writableDatabase.insert("items", null, v)
                  else writableDatabase.update("items", v, "id=?", arrayOf(id.toString()))
              }
              fun delete(id: Long) { writableDatabase.delete("items", "id=?", arrayOf(id.toString())) }

              fun allPayments(): List<Payment> {
                  val out = mutableListOf<Payment>()
                  readableDatabase.rawQuery("SELECT id, amount, note, dateTime, createdMs FROM payments ORDER BY id DESC", null).use { c ->
                      while (c.moveToNext()) out.add(Payment(c.getLong(0), c.getDouble(1), c.getString(2) ?: "", c.getString(3) ?: "", c.getLong(4)))
                  }
                  return out
              }
              fun savePayment(id: Long?, amount: Double, note: String, date: String, ms: Long) {
                  val v = ContentValues().apply {
                      put("amount", amount); put("note", note); put("dateTime", date); put("createdMs", ms)
                  }
                  if (id == null) writableDatabase.insert("payments", null, v)
                  else writableDatabase.update("payments", v, "id=?", arrayOf(id.toString()))
              }
              fun deletePayment(id: Long) { writableDatabase.delete("payments", "id=?", arrayOf(id.toString())) }
              fun clearAll() {
                  writableDatabase.delete("items", null, null)
                  writableDatabase.delete("payments", null, null)
              }
          }

          class MainActivity : ComponentActivity() {
              private lateinit var db: Db
              private lateinit var root: FrameLayout
              private var chosenPhoto = ""
              private var previewImg: ImageView? = null
              private var photoStatus: TextView? = null
              private var searchText = ""
              private var currentTab = 0

              private var filterByDate = false
              private var fromMs = 0L
              private var toMs = 0L

              private val greenDark = 0xFF0B4628.toInt()
              private val greenBtn = 0xFF0D6832.toInt()
              private val greenLight = 0xFFE6F4EC.toInt()
              private val goldColor = 0xFFFFD43B.toInt()
              private val bgColor = 0xFFF2F6F4.toInt()
              private val textDark = 0xFF14201A.toInt()
              private val textMuted = 0xFF5F6F67.toInt()

              private fun prefs() = getSharedPreferences("fh_prefs", Context.MODE_PRIVATE)
              private fun isLockEnabled() = prefs().getBoolean("screen_lock", true)

              private val authLauncher = registerForActivityResult(ActivityResultContracts.StartActivityForResult()) { res ->
                  if (res.resultCode == Activity.RESULT_OK) openTab(0) else showLockedScreen()
              }
              private val pickPhoto = registerForActivityResult(ActivityResultContracts.GetContent()) { uri ->
                  if (uri != null) {
                      val dest = File(filesDir, "photo_${System.currentTimeMillis()}.jpg")
                      contentResolver.openInputStream(uri)?.use { input -> dest.outputStream().use { input.copyTo(it) } }
                      chosenPhoto = dest.absolutePath
                      BitmapFactory.decodeFile(chosenPhoto)?.let { previewImg?.setImageBitmap(it) }
                      photoStatus?.text = "📷 Change Photo ✓"
                  }
              }
              private val exportBackup = registerForActivityResult(ActivityResultContracts.CreateDocument("application/json")) { uri ->
                  if (uri != null) try { contentResolver.openOutputStream(uri)?.bufferedWriter()?.use { it.write(makeBackup().toString(2)) }; toast("Backup Saved ✓") } catch (e: Exception) { toast("Backup failed") }
              }
              private val importBackup = registerForActivityResult(ActivityResultContracts.OpenDocument()) { uri ->
                  if (uri != null) try {
                      val text = contentResolver.openInputStream(uri)?.bufferedReader()?.use { it.readText() } ?: ""
                      restoreBackup(JSONObject(text)); openTab(0); toast("Backup Restored ✓")
                  } catch (e: Exception) { toast("Invalid backup file") }
              }

              @Suppress("DEPRECATION")
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  window.statusBarColor = greenDark
                  window.navigationBarColor = 0xFFFFFFFF.toInt()
                  db = Db(this)
                  initDefaultMonthRange()
                  root = FrameLayout(this).apply {
                      setBackgroundColor(greenDark)
                      setOnApplyWindowInsetsListener { v, insets ->
                          v.setPadding(0, insets.systemWindowInsetTop, 0, insets.systemWindowInsetBottom)
                          insets
                      }
                  }
                  setContentView(root)
                  showSplash()
              }

              private fun initDefaultMonthRange() {
                  val c = Calendar.getInstance()
                  c.set(Calendar.DAY_OF_MONTH, 1); c.set(Calendar.HOUR_OF_DAY, 0); c.set(Calendar.MINUTE, 0); c.set(Calendar.SECOND, 0)
                  fromMs = c.timeInMillis
                  val c2 = Calendar.getInstance()
                  c2.set(Calendar.HOUR_OF_DAY, 23); c2.set(Calendar.MINUTE, 59); c2.set(Calendar.SECOND, 59)
                  toMs = c2.timeInMillis
              }

              private fun showSplash() {
                  root.removeAllViews()
                  val splash = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL; gravity = Gravity.CENTER
                      background = GradientDrawable(GradientDrawable.Orientation.TOP_BOTTOM, intArrayOf(0xFF146C43.toInt(), 0xFF062C1A.toInt()))
                      setPadding(dp(24), dp(24), dp(24), dp(24))
                  }
                  splash.addView(TextView(this).apply { text = "🏠"; textSize = 72f; gravity = Gravity.CENTER })
                  splash.addView(TextView(this).apply {
                      text = "Furniture"; textSize = 36f; setTypeface(null, Typeface.BOLD)
                      setTextColor(0xFFFFFFFF.toInt()); gravity = Gravity.CENTER
                  })
                  splash.addView(TextView(this).apply {
                      text = "Hisab"; textSize = 36f; setTypeface(null, Typeface.BOLD)
                      setTextColor(goldColor); gravity = Gravity.CENTER
                  }, lp(-1, -2, dp(12)))
                  splash.addView(TextView(this).apply {
                      text = "Hisab Rakho,\nTension Chhodo..."; textSize = 18f; setTypeface(null, Typeface.ITALIC)
                      setTextColor(0xFFE8F5E9.toInt()); gravity = Gravity.CENTER
                  }, lp(-1, -2, dp(28)))
                  splash.addView(ProgressBar(this).apply { isIndeterminate = true })
                  splash.addView(TextView(this).apply {
                      text = "Loading..."; textSize = 13f; setTextColor(0xFFC8E6C9.toInt()); gravity = Gravity.CENTER
                      setPadding(0, dp(8), 0, 0)
                  })
                  root.addView(splash)
                  Handler(Looper.getMainLooper()).postDelayed({ checkAuthAndOpen() }, 1000)
              }

              @Suppress("DEPRECATION")
              private fun checkAuthAndOpen() {
                  if (!isLockEnabled()) { openTab(0); return }
                  val km = getSystemService(Context.KEYGUARD_SERVICE) as KeyguardManager
                  if (km.isKeyguardSecure) {
                      val intent = km.createConfirmDeviceCredentialIntent(
                          "Furniture Hisab Locked",
                          "Fingerprint, Face Lock ya Screen Lock se unlock karein"
                      )
                      if (intent != null) { showLockedScreen(); authLauncher.launch(intent); return }
                  }
                  openTab(0)
              }

              private fun showLockedScreen() {
                  root.removeAllViews()
                  val lockPage = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL; gravity = Gravity.CENTER
                      background = GradientDrawable(GradientDrawable.Orientation.TOP_BOTTOM, intArrayOf(0xFF146C43.toInt(), 0xFF062C1A.toInt()))
                      setPadding(dp(28), dp(28), dp(28), dp(28))
                  }
                  lockPage.addView(TextView(this).apply { text = "🔒"; textSize = 64f; gravity = Gravity.CENTER }, lp(-1, -2, dp(14)))
                  lockPage.addView(TextView(this).apply {
                      text = "Furniture Hisab Locked"; textSize = 24f; setTypeface(null, Typeface.BOLD)
                      setTextColor(0xFFFFFFFF.toInt()); gravity = Gravity.CENTER
                  }, lp(-1, -2, dp(8)))
                  lockPage.addView(TextView(this).apply {
                      text = "Fingerprint, Face Lock ya Screen Lock lagayein"; textSize = 15f
                      setTextColor(0xFFC8E6C9.toInt()); gravity = Gravity.CENTER
                  }, lp(-1, -2, dp(28)))
                  lockPage.addView(TextView(this).apply {
                      text = "🔓  Unlock App"; textSize = 17f; setTypeface(null, Typeface.BOLD)
                      setTextColor(greenDark); gravity = Gravity.CENTER
                      background = roundBg(0xFFFFFFFF.toInt(), 26); setPadding(dp(28), dp(14), dp(28), dp(14))
                      setOnClickListener { checkAuthAndOpen() }
                  })
                  root.addView(lockPage)
              }

              private fun dp(v: Int) = (v * resources.displayMetrics.density).toInt()
              private fun roundBg(color: Int, r: Int, stroke: Int = 0) = GradientDrawable().apply {
                  setColor(color); cornerRadius = dp(r).toFloat()
                  if (stroke != 0) setStroke(dp(1), stroke)
              }

              private fun topBar(title: String, rightText: String = "", onRight: (() -> Unit)? = null): LinearLayout {
                  return LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL; gravity = Gravity.CENTER_VERTICAL
                      setBackgroundColor(greenDark); setPadding(dp(16), dp(14), dp(16), dp(14))
                      addView(TextView(context).apply {
                          text = title; textSize = 20f; setTypeface(null, Typeface.BOLD)
                          setTextColor(0xFFFFFFFF.toInt())
                      }, LinearLayout.LayoutParams(0, -2, 1f))
                      if (rightText.isNotEmpty() && onRight != null) {
                          addView(TextView(context).apply {
                              text = rightText; textSize = 20f; setTextColor(0xFFFFFFFF.toInt())
                              setPadding(dp(12), dp(4), dp(4), dp(4)); setOnClickListener { onRight() }
                          })
                      }
                  }
              }

              private fun bottomBar(): LinearLayout {
                  val bar = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL; gravity = Gravity.CENTER_VERTICAL
                      setBackgroundColor(0xFFFFFFFF.toInt()); elevation = dp(8).toFloat()
                      setPadding(0, dp(10), 0, dp(10))
                  }
                  fun tab(icon: String, label: String, active: Boolean, onClick: () -> Unit) {
                      val item = LinearLayout(this).apply {
                          orientation = LinearLayout.VERTICAL; gravity = Gravity.CENTER
                          setOnClickListener { onClick() }
                      }
                      item.addView(TextView(this).apply { text = icon; textSize = 20f; gravity = Gravity.CENTER })
                      item.addView(TextView(this).apply {
                          text = label; textSize = 11f; gravity = Gravity.CENTER
                          setTypeface(null, if (active) Typeface.BOLD else Typeface.NORMAL)
                          setTextColor(if (active) greenBtn else textMuted)
                      })
                      bar.addView(item, LinearLayout.LayoutParams(0, -2, 1f))
                  }
                  tab("🏠", "Home", currentTab == 0) { openTab(0) }
                  tab("🔍", "Search", currentTab == 1) { openTab(1) }
                  val plusBtn = TextView(this).apply {
                      text = "+"; textSize = 22f; setTypeface(null, Typeface.BOLD); setTextColor(0xFFFFFFFF.toInt())
                      gravity = Gravity.CENTER; background = roundBg(greenBtn, 16)
                      setPadding(dp(14), dp(4), dp(14), dp(4)); setOnClickListener { showForm(null) }
                  }
                  val plusWrap = FrameLayout(this).apply { addView(plusBtn, FrameLayout.LayoutParams(-2, -2, Gravity.CENTER)) }
                  bar.addView(plusWrap, LinearLayout.LayoutParams(0, -2, 1f))
                  tab("💰", "Hisab", currentTab == 2) { openTab(2) }
                  tab("⚙️", "Profile", currentTab == 3) { openTab(3) }
                  return bar
              }

              private fun openTab(tab: Int) {
                  currentTab = tab
                  when (tab) {
                      0 -> showHome()
                      1 -> showSearchTab()
                      2 -> showHisabDashboard()
                      3 -> showSettings()
                  }
              }

              private fun wrapWithBottomBar(page: LinearLayout) {
                  val divider = View(this).apply { setBackgroundColor(0xFFDCE7E1.toInt()) }
                  page.addView(divider, LinearLayout.LayoutParams(-1, dp(1)))
                  page.addView(bottomBar())
                  root.removeAllViews()
                  root.addView(page)
              }

              private fun startNewHisab() {
                  AlertDialog.Builder(this)
                      .setTitle("नया हिसाब चालू करें?")
                      .setMessage("क्या आप अभी के सारे फर्नीचर और पेमेंट रिकॉर्ड साफ करके ₹0 से नया हिसाब शुरू करना चाहते हैं?")
                      .setNeutralButton("पहले Backup सेव करें") { _, _ -> exportBackup.launch("FurnitureHisabBackup.json") }
                      .setNegativeButton("Cancel", null)
                      .setPositiveButton("हाँ, नया हिसाब चालू करें") { _, _ ->
                          db.clearAll()
                          openTab(currentTab)
                          toast("नया हिसाब शुरू हो गया ✓")
                      }.show()
              }

              private fun showHome() {
                  val page = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; setBackgroundColor(bgColor) }
                  page.addView(topBar("Furniture Hisab", "☁", { showBackup() }))

                  val scroll = ScrollView(this)
                  val body = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; setPadding(dp(16), dp(16), dp(16), dp(24)) }
                  val records = db.all()
                  val total = records.sumOf { it.amount }

                  val summaryCard = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL; gravity = Gravity.CENTER_VERTICAL
                      background = roundBg(0xFFFFFFFF.toInt(), 18, 0xFFDCE7E1.toInt())
                      elevation = dp(4).toFloat(); setPadding(dp(18), dp(18), dp(18), dp(18))
                  }
                  val sumLeft = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL }
                  sumLeft.addView(TextView(this).apply { text = "Total Kaam (All Entries)"; textSize = 14f; setTextColor(textMuted) })
                  sumLeft.addView(TextView(this).apply {
                      text = "₹ ${money(total)}"; textSize = 27f; setTypeface(null, Typeface.BOLD); setTextColor(textDark)
                      setPadding(0, dp(4), 0, dp(6))
                  })
                  sumLeft.addView(TextView(this).apply {
                      text = "📊 Total Furniture: ${records.size}"; textSize = 14f; setTypeface(null, Typeface.BOLD); setTextColor(greenDark)
                  })
                  summaryCard.addView(sumLeft, LinearLayout.LayoutParams(0, -2, 1f))
                  summaryCard.addView(TextView(this).apply {
                      text = "📈"; textSize = 38f; gravity = Gravity.CENTER
                      background = roundBg(greenLight, 14); setPadding(dp(14), dp(10), dp(14), dp(10))
                  })
                  body.addView(summaryCard, lp(-1, -2, dp(14)))

                  val addBtn = TextView(this).apply {
                      text = "+  Add New Furniture"; textSize = 17f; setTypeface(null, Typeface.BOLD)
                      setTextColor(0xFFFFFFFF.toInt()); gravity = Gravity.CENTER
                      background = roundBg(greenBtn, 26); elevation = dp(3).toFloat()
                      setPadding(dp(16), dp(14), dp(16), dp(14))
                      setOnClickListener { showForm(null) }
                  }
                  body.addView(addBtn, lp(-1, -2, dp(18)))

                  body.addView(TextView(this).apply {
                      text = "Furniture Photo Series (${records.size})"; textSize = 17f; setTypeface(null, Typeface.BOLD); setTextColor(textDark)
                  }, lp(-1, -2, dp(10)))

                  if (records.isEmpty()) {
                      body.addView(TextView(this).apply {
                          text = "Abhi koi entry nahi hai.\n'+ Add New Furniture' par tap karein."; gravity = Gravity.CENTER
                          textSize = 15f; setTextColor(textMuted); setPadding(dp(16), dp(30), dp(16), dp(30))
                          background = roundBg(0xFFFFFFFF.toInt(), 14)
                      })
                  } else {
                      records.forEachIndexed { idx, item -> body.addView(recordCard(item, records.size - idx), lp(-1, -2, dp(10))) }
                  }
                  scroll.addView(body)
                  page.addView(scroll, LinearLayout.LayoutParams(-1, 0, 1f))
                  wrapWithBottomBar(page)
              }

              private fun showSearchTab() {
                  val page = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; setBackgroundColor(bgColor) }
                  page.addView(topBar("Search Furniture"))
                  val searchBox = EditText(this).apply {
                      hint = "🔍 Search Model, Size, Date or Amount..."; setText(searchText)
                      background = roundBg(0xFFFFFFFF.toInt(), 12, 0xFFD0DDD6.toInt())
                      setPadding(dp(14), dp(12), dp(14), dp(12))
                  }
                  page.addView(searchBox, LinearLayout.LayoutParams(-1, -2).apply { setMargins(dp(14), dp(12), dp(14), dp(6)) })

                  val scroll = ScrollView(this)
                  val list = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; setPadding(dp(14), dp(8), dp(14), dp(20)) }
                  fun renderList(q: String) {
                      list.removeAllViews()
                      val matched = db.all().filter {
                          q.isBlank() || it.model.contains(q, true) || it.size.contains(q, true) || it.amount.toString().contains(q) || it.dateTime.contains(q, true)
                      }
                      matched.forEachIndexed { idx, it -> list.addView(recordCard(it, matched.size - idx), lp(-1, -2, dp(10))) }
                  }
                  renderList(searchText)
                  searchBox.addTextChangedListener(object : TextWatcher {
                      override fun beforeTextChanged(s: CharSequence?, a: Int, b: Int, c: Int) {}
                      override fun onTextChanged(s: CharSequence?, a: Int, b: Int, c: Int) { searchText = s.toString(); renderList(searchText) }
                      override fun afterTextChanged(s: Editable?) {}
                  })
                  scroll.addView(list)
                  page.addView(scroll, LinearLayout.LayoutParams(-1, 0, 1f))
                  wrapWithBottomBar(page)
              }

              private fun showHisabDashboard() {
                  val page = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; setBackgroundColor(bgColor) }
                  page.addView(topBar("हिसाब (Hisab Dashboard)", "🔄", { startNewHisab() }))

                  val scroll = ScrollView(this)
                  val body = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; setPadding(dp(16), dp(14), dp(16), dp(24)) }

                  val fmt = SimpleDateFormat("dd MMM yyyy", Locale.getDefault())
                  val modeRow = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL }
                  val allBtn = TextView(this).apply {
                      text = "All Time (कुल)"; gravity = Gravity.CENTER; textSize = 13f; setTypeface(null, Typeface.BOLD)
                      setTextColor(if (!filterByDate) 0xFFFFFFFF.toInt() else greenDark)
                      background = roundBg(if (!filterByDate) greenBtn else 0xFFFFFFFF.toInt(), 20, greenBtn)
                      setPadding(dp(10), dp(9), dp(10), dp(9))
                      setOnClickListener { filterByDate = false; showHisabDashboard() }
                  }
                  val rangeBtn = TextView(this).apply {
                      text = "📅 तारीख से तारीख (1–30)"; gravity = Gravity.CENTER; textSize = 13f; setTypeface(null, Typeface.BOLD)
                      setTextColor(if (filterByDate) 0xFFFFFFFF.toInt() else greenDark)
                      background = roundBg(if (filterByDate) greenBtn else 0xFFFFFFFF.toInt(), 20, greenBtn)
                      setPadding(dp(10), dp(9), dp(10), dp(9))
                      setOnClickListener { filterByDate = true; showHisabDashboard() }
                  }
                  modeRow.addView(allBtn, LinearLayout.LayoutParams(0, -2, 1f).apply { rightMargin = dp(8) })
                  modeRow.addView(rangeBtn, LinearLayout.LayoutParams(0, -2, 1f))
                  body.addView(modeRow, lp(-1, -2, dp(10)))

                  if (filterByDate) {
                      val dateRow = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL }
                      fun pickDate(isFrom: Boolean) {
                          val cal = Calendar.getInstance().apply { timeInMillis = if (isFrom) fromMs else toMs }
                          DatePickerDialog(this, { _, y, m, d ->
                              val c = Calendar.getInstance()
                              if (isFrom) {
                                  c.set(y, m, d, 0, 0, 0); fromMs = c.timeInMillis
                              } else {
                                  c.set(y, m, d, 23, 59, 59); toMs = c.timeInMillis
                              }
                              showHisabDashboard()
                          }, cal.get(Calendar.YEAR), cal.get(Calendar.MONTH), cal.get(Calendar.DAY_OF_MONTH)).show()
                      }
                      dateRow.addView(TextView(this).apply {
                          text = "From: ${fmt.format(Date(fromMs))}"; gravity = Gravity.CENTER; textSize = 13f; setTextColor(textDark)
                          background = roundBg(0xFFFFFFFF.toInt(), 12, 0xFFD0DDD6.toInt()); setPadding(dp(10), dp(10), dp(10), dp(10))
                          setOnClickListener { pickDate(true) }
                      }, LinearLayout.LayoutParams(0, -2, 1f).apply { rightMargin = dp(8) })
                      dateRow.addView(TextView(this).apply {
                          text = "To: ${fmt.format(Date(toMs))}"; gravity = Gravity.CENTER; textSize = 13f; setTextColor(textDark)
                          background = roundBg(0xFFFFFFFF.toInt(), 12, 0xFFD0DDD6.toInt()); setPadding(dp(10), dp(10), dp(10), dp(10))
                          setOnClickListener { pickDate(false) }
                      }, LinearLayout.LayoutParams(0, -2, 1f))
                      body.addView(dateRow, lp(-1, -2, dp(12)))
                  }

                  val allItems = db.all()
                  val allPays = db.allPayments()
                  val items = if (!filterByDate) allItems else allItems.filter { it.createdMs == 0L || it.createdMs in fromMs..toMs }
                  val payments = if (!filterByDate) allPays else allPays.filter { it.createdMs == 0L || it.createdMs in fromMs..toMs }

                  val totalBill = items.sumOf { it.amount }
                  val totalReceived = payments.sumOf { it.amount }
                  val balance = totalBill - totalReceived

                  val card = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      background = roundBg(0xFFFFFFFF.toInt(), 18, 0xFFDCE7E1.toInt())
                      elevation = dp(4).toFloat(); setPadding(dp(18), dp(16), dp(18), dp(16))
                  }
                  fun statRow(label: String, value: String, valueColor: Int, big: Boolean = false) {
                      val r = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL; gravity = Gravity.CENTER_VERTICAL }
                      r.addView(TextView(this).apply { text = label; textSize = if (big) 16f else 14f; setTextColor(textMuted) }, LinearLayout.LayoutParams(0, -2, 1f))
                      r.addView(TextView(this).apply {
                          text = value; textSize = if (big) 22f else 17f; setTypeface(null, Typeface.BOLD); setTextColor(valueColor)
                      })
                      card.addView(r, lp(-1, -2, dp(8)))
                  }
                  statRow("Kaam (Items Done)", "${items.size} Items", textDark)
                  statRow("Total Kaam (Bill)", "₹ ${money(totalBill)}", textDark)
                  statRow("Seth ne Diya (Mila)", "₹ ${money(totalReceived)}", greenBtn)
                  card.addView(View(this).apply { setBackgroundColor(0xFFE0EAE4.toInt()) }, lp(-1, dp(1), dp(10)))
                  statRow("Baki Lena Hai (Balance)", "₹ ${money(balance)}", if (balance > 0) 0xFFB71C1C.toInt() else greenDark, true)
                  card.addView(TextView(this).apply {
                      text = "🧾 Total Transactions: ${payments.size}"
                      textSize = 13f; setTypeface(null, Typeface.BOLD); setTextColor(greenDark)
                      background = roundBg(greenLight, 10); setPadding(dp(12), dp(8), dp(12), dp(8))
                  })
                  body.addView(card, lp(-1, -2, dp(14)))

                  val payBtn = TextView(this).apply {
                      text = "+  सेठ से पैसा मिला (Add Payment)"; textSize = 16f; setTypeface(null, Typeface.BOLD)
                      setTextColor(0xFFFFFFFF.toInt()); gravity = Gravity.CENTER
                      background = roundBg(greenBtn, 26); elevation = dp(3).toFloat()
                      setPadding(dp(16), dp(14), dp(16), dp(14))
                      setOnClickListener { showPaymentDialog(null) }
                  }
                  body.addView(payBtn, lp(-1, -2, dp(16)))

                  body.addView(TextView(this).apply {
                      text = "Transaction History (${payments.size})"; textSize = 16f; setTypeface(null, Typeface.BOLD); setTextColor(textDark)
                  }, lp(-1, -2, dp(10)))

                  if (payments.isEmpty()) {
                      body.addView(TextView(this).apply {
                          text = "Is period me koi payment transaction nahi hai."; gravity = Gravity.CENTER
                          textSize = 15f; setTextColor(textMuted); setPadding(dp(16), dp(26), dp(16), dp(26))
                          background = roundBg(0xFFFFFFFF.toInt(), 14)
                      })
                  } else {
                      payments.forEachIndexed { idx, p ->
                          val tCard = LinearLayout(this).apply {
                              orientation = LinearLayout.HORIZONTAL; gravity = Gravity.CENTER_VERTICAL
                              background = roundBg(0xFFFFFFFF.toInt(), 14, 0xFFE2EBE6.toInt())
                              elevation = dp(2).toFloat(); setPadding(dp(14), dp(12), dp(10), dp(12))
                          }
                          tCard.addView(TextView(this).apply {
                              text = "💵"; textSize = 24f; gravity = Gravity.CENTER
                              background = roundBg(greenLight, 12); setPadding(dp(12), dp(10), dp(12), dp(10))
                          }, LinearLayout.LayoutParams(-2, -2).apply { rightMargin = dp(12) })

                          val tInfo = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL }
                          tInfo.addView(TextView(this).apply {
                              text = "#${payments.size - idx}   ₹ ${money(p.amount)}"; textSize = 17f
                              setTypeface(null, Typeface.BOLD); setTextColor(greenBtn)
                          })
                          if (p.note.isNotBlank()) {
                              tInfo.addView(TextView(this).apply { text = p.note; textSize = 14f; setTextColor(textDark) })
                          }
                          tInfo.addView(TextView(this).apply { text = "📅 ${p.dateTime}"; textSize = 11f; setTextColor(textMuted) })
                          tCard.addView(tInfo, LinearLayout.LayoutParams(0, -2, 1f))

                          tCard.addView(TextView(this).apply {
                              text = "⋮"; textSize = 22f; setTypeface(null, Typeface.BOLD); setTextColor(textMuted)
                              setPadding(dp(10), dp(6), dp(6), dp(6))
                              setOnClickListener { v ->
                                  PopupMenu(context, v).apply {
                                      menu.add("Edit"); menu.add("Delete")
                                      setOnMenuItemClickListener { m ->
                                          if (m.title == "Edit") showPaymentDialog(p)
                                          else AlertDialog.Builder(context).setMessage("Delete ₹ ${money(p.amount)} transaction?")
                                              .setNegativeButton("Cancel", null)
                                              .setPositiveButton("Delete") { _, _ -> db.deletePayment(p.id); showHisabDashboard() }.show()
                                          true
                                      }
                                  }.show()
                              }
                          })
                          body.addView(tCard, lp(-1, -2, dp(10)))
                      }
                  }
                  scroll.addView(body)
                  page.addView(scroll, LinearLayout.LayoutParams(-1, 0, 1f))
                  wrapWithBottomBar(page)
              }

              private fun showPaymentDialog(p: Payment?) {
                  val box = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; setPadding(dp(20), dp(12), dp(20), dp(8)) }
                  val amt = EditText(this).apply {
                      hint = "Amount (₹)"; setText(if (p != null) p.amount.toString() else "")
                      inputType = InputType.TYPE_CLASS_NUMBER or InputType.TYPE_NUMBER_FLAG_DECIMAL
                  }
                  val note = EditText(this).apply {
                      hint = "Note (e.g. Seth ne diya / Advance / Cash)"; setText(p?.note ?: "Seth Payment")
                  }
                  val date = EditText(this).apply {
                      hint = "Date & Time"
                      setText(p?.dateTime ?: SimpleDateFormat("dd MMM yyyy, EEE • hh:mm a", Locale.getDefault()).format(Date()))
                  }
                  box.addView(amt, lp(-1, -2, dp(8)))
                  box.addView(note, lp(-1, -2, dp(8)))
                  box.addView(date, lp(-1, -2, dp(4)))

                  AlertDialog.Builder(this)
                      .setTitle(if (p == null) "सेठ से पैसा मिला" else "Edit Payment")
                      .setView(box)
                      .setNegativeButton("Cancel", null)
                      .setPositiveButton("Save") { _, _ ->
                          val a = amt.text.toString().trim().toDoubleOrNull()
                          if (a == null || a <= 0) toast("Sahi amount bhariye")
                          else {
                              db.savePayment(p?.id, a, note.text.toString().trim(), date.text.toString().trim(), p?.createdMs ?: System.currentTimeMillis())
                              showHisabDashboard()
                              toast("Payment Saved ✓")
                          }
                      }.show()
              }

