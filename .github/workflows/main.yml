name: Furniture Hisab APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Extract project ZIP
        run: |
          mkdir -p extracted
          for z in *.zip; do
            [ -f "$z" ] && unzip -o "$z" -d extracted
          done

      - name: Set Unique ZFH Icon + Safe App
        run: |
          PROJECT_DIR=$(dirname "$(find . -maxdepth 5 \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) | head -n 1)")
          APP_DIR="$PROJECT_DIR/app"
          find "$APP_DIR/src/main/res" -name "ic_launcher*" -delete
          python3 -m pip install -q pillow || true
          python3 - "$APP_DIR/src/main/res" << 'PYICON'
          import os, sys, glob
          from PIL import Image
          res_dir = sys.argv[1]
          imgs = [f for f in glob.glob("*.*") if f.lower().endswith((".png", ".jpg", ".jpeg", ".webp"))]
          im = Image.open(imgs[0]).convert("RGBA")
          w, h = im.size
          m = min(w, h)
          im = im.crop(((w - m) // 2, (h - m) // 2, (w + m) // 2, (h + m) // 2))
          for folder, sz in [("mipmap-mdpi", 48), ("mipmap-hdpi", 72), ("mipmap-xhdpi", 96), ("mipmap-xxhdpi", 144), ("mipmap-xxxhdpi", 192)]:
              d = os.path.join(res_dir, folder)
              os.makedirs(d, exist_ok=True)
              im.resize((sz, sz), Image.LANCZOS).save(os.path.join(d, "zfh_icon.png"))
          PYICON
          MANIFEST=$(find "$APP_DIR/src/main" -name "AndroidManifest.xml" | head -n 1)
          python3 - "$MANIFEST" << 'PYM'
          import sys, re
          p = sys.argv[1]
          s = open(p, encoding='utf-8').read()
          if 'android.permission.INTERNET' not in s:
              s = s.replace('<application', '<uses-permission android:name="android.permission.INTERNET"/>\n    <application', 1)
          s = re.sub(r'android:icon="[^"]*"', 'android:icon="@mipmap/zfh_icon"', s)
          s = re.sub(r'android:roundIcon="[^"]*"', 'android:roundIcon="@mipmap/zfh_icon"', s)
          s = re.sub(r'android:label="[^"]*"', 'android:label="ZFH Ledger"', s)
          if 'android:icon=' not in s:
              s = s.replace('<application', '<application android:icon="@mipmap/zfh_icon" android:roundIcon="@mipmap/zfh_icon"', 1)
          open(p, 'w', encoding='utf-8').write(s)
          PYM
          TARGET_KT=$(find "$APP_DIR/src/main" -name "MainActivity.kt" | head -n 1)
          cp ./MainActivity.kt "$TARGET_KT"

      - name: Build Debug APK
        run: |
          PROJECT_DIR=$(dirname "$(find . -maxdepth 5 \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) | head -n 1)")
          printf 'allprojects {\n  tasks.configureEach { t ->\n    if (t.hasProperty("kotlinOptions")) { t.kotlinOptions.jvmTarget = "1.8" }\n  }\n}\n' > /tmp/fix-jvm.gradle
          cd "$PROJECT_DIR"
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --init-script /tmp/fix-jvm.gradle
          else
            gradle assembleDebug --init-script /tmp/fix-jvm.gradle
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FurnitureHisab-APK
          path: "**/build/outputs/apk/debug/*.apk"
