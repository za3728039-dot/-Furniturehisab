              private fun showForm(item: Furniture?) {
                  chosenPhoto = item?.photo ?: ""
                  root.removeAllViews()
                  val page = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; setBackgroundColor(bgColor) }
                  val scroll = ScrollView(this)
                  val box = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; setPadding(dp(16), dp(16), dp(16), dp(24)) }

                  val photoBox = FrameLayout(this).apply { background = roundBg(greenLight, 16, 0xFFCDE0D5.toInt()); clipToOutline = true }
                  val img = ImageView(this).apply {
                      scaleType = ImageView.ScaleType.CENTER_CROP
                      val bmp = if (chosenPhoto.isNotBlank() && File(chosenPhoto).exists()) BitmapFactory.decodeFile(chosenPhoto) else null
                      if (bmp != null) setImageBitmap(bmp) else setImageResource(android.R.drawable.ic_menu_camera)
                  }
                  previewImg = img
                  photoBox.addView(img, FrameLayout.LayoutParams(-1, dp(180)))
                  val camPill = TextView(this).apply {
                      text = if (chosenPhoto.isNotBlank()) "📷 Change Photo" else "📷 Choose Photo"
                      setTextColor(0xFFFFFFFF.toInt()); textSize = 14f; setTypeface(null, Typeface.BOLD)
                      background = roundBg(0xCC111111.toInt(), 20); setPadding(dp(16), dp(8), dp(16), dp(8))
                      setOnClickListener { pickPhoto.launch("image/*") }
                  }
                  photoStatus = camPill
                  photoBox.addView(camPill, FrameLayout.LayoutParams(-2, -2, Gravity.BOTTOM or Gravity.CENTER_HORIZONTAL).apply { bottomMargin = dp(12) })
                  box.addView(photoBox, lp(-1, dp(180), dp(14)))

                  fun inputCard(icon: String, label: String, value: String, num: Boolean = false): EditText {
                      val row = LinearLayout(this).apply {
                          orientation = LinearLayout.HORIZONTAL; gravity = Gravity.CENTER_VERTICAL
                          background = roundBg(0xFFFFFFFF.toInt(), 12, 0xFFD5E2DB.toInt())
                          setPadding(dp(14), dp(10), dp(14), dp(10))
                      }
                      row.addView(TextView(this).apply { text = icon; textSize = 20f; setPadding(0, 0, dp(12), 0) })
                      val col = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL }
                      col.addView(TextView(this).apply { text = label; textSize = 12f; setTextColor(greenDark); setTypeface(null, Typeface.BOLD) })
                      val e = EditText(this).apply {
                          setText(value); setBackgroundColor(0); setPadding(0, dp(2), 0, 0); textSize = 16f
                          if (num) inputType = InputType.TYPE_CLASS_NUMBER or InputType.TYPE_NUMBER_FLAG_DECIMAL
                      }
                      col.addView(e)
                      row.addView(col, LinearLayout.LayoutParams(0, -2, 1f))
                      box.addView(row, lp(-1, -2, dp(12)))
                      return e
                  }

                  val size = inputCard("📐", "Size (e.g. 6x3 ft)", item?.size ?: "")
                  val model = inputCard("#️⃣", "Model No. (e.g. SF-101)", item?.model ?: "")
                  val amount = inputCard("₹", "Amount (₹)", if (item != null) item.amount.toString() else "", true)
                  val date = inputCard("📅", "Date & Time", item?.dateTime ?: SimpleDateFormat("dd MMM yyyy, EEE • hh:mm a", Locale.getDefault()).format(Date()))

                  val doSave = {
                      val a = amount.text.toString().trim().toDoubleOrNull()
                      if (model.text.isBlank() || a == null) toast("Model No. aur valid Amount bhariye")
                      else {
                          db.save(item?.id, model.text.toString().trim(), size.text.toString().trim(), a, date.text.toString().trim(), chosenPhoto, item?.createdMs ?: System.currentTimeMillis())
                          openTab(0); toast("Record Saved ✓")
                      }
                  }
                  val saveBtn = TextView(this).apply {
                      text = "✓  Save Record"; textSize = 17f; setTypeface(null, Typeface.BOLD)
                      setTextColor(0xFFFFFFFF.toInt()); gravity = Gravity.CENTER
                      background = roundBg(greenBtn, 26); setPadding(dp(16), dp(14), dp(16), dp(14))
                      setOnClickListener { doSave() }
                  }
                  box.addView(saveBtn, lp(-1, -2, dp(10)))
                  scroll.addView(box)

                  val bar = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL; gravity = Gravity.CENTER_VERTICAL
                      setBackgroundColor(greenDark); setPadding(dp(14), dp(14), dp(14), dp(14))
                      addView(TextView(context).apply {
                          text = "←"; textSize = 22f; setTextColor(0xFFFFFFFF.toInt())
                          setPadding(dp(8), dp(4), dp(12), dp(4)); setOnClickListener { openTab(currentTab) }
                      })
                      addView(TextView(context).apply {
                          text = if (item == null) "Add Furniture" else "Edit Furniture"; textSize = 20f
                          setTypeface(null, Typeface.BOLD); setTextColor(0xFFFFFFFF.toInt()); gravity = Gravity.CENTER
                      }, LinearLayout.LayoutParams(0, -2, 1f))
                      addView(TextView(context).apply {
                          text = "💾"; textSize = 20f; setTextColor(0xFFFFFFFF.toInt())
                          setPadding(dp(12), dp(4), dp(8), dp(4)); setOnClickListener { doSave() }
                      })
                  }
                  page.addView(bar)
                  page.addView(scroll, LinearLayout.LayoutParams(-1, 0, 1f))
                  root.addView(page)
              }

