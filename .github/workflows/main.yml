              private fun makeBackup(): JSONObject {
                  val arr = JSONArray()
                  db.all().forEach { f ->
                      val obj = JSONObject().put("id", f.id).put("model", f.model).put("size", f.size)
                          .put("amount", f.amount).put("dateTime", f.dateTime).put("createdMs", f.createdMs)
                      if (f.photo.isNotBlank() && File(f.photo).exists()) {
                          obj.put("photoName", File(f.photo).name).put("photoBase64", Base64.encodeToString(File(f.photo).readBytes(), Base64.NO_WRAP))
                      }
                      arr.put(obj)
                  }
                  val pArr = JSONArray()
                  db.allPayments().forEach { p ->
                      pArr.put(JSONObject().put("id", p.id).put("amount", p.amount).put("note", p.note).put("dateTime", p.dateTime).put("createdMs", p.createdMs))
                  }
                  return JSONObject().put("app", "FurnitureHisab").put("version", 4).put("items", arr).put("payments", pArr)
              }
              private fun restoreBackup(data: JSONObject) {
                  val arr = data.getJSONArray("items")
                  db.clearAll()
                  for (i in 0 until arr.length()) {
                      val o = arr.getJSONObject(i)
                      var photo = ""
                      if (o.has("photoBase64")) {
                          val name = o.optString("photoName", "restored_$i.jpg").replace(Regex("[^A-Za-z0-9._-]"), "_")
                          val file = File(filesDir, name)
                          file.writeBytes(Base64.decode(o.getString("photoBase64"), Base64.DEFAULT))
                          photo = file.absolutePath
                      }
                      db.save(null, o.optString("model"), o.optString("size"), o.optDouble("amount"), o.optString("dateTime"), photo, o.optLong("createdMs", System.currentTimeMillis()))
                  }
                  if (data.has("payments")) {
                      val pArr = data.getJSONArray("payments")
                      for (i in 0 until pArr.length()) {
                          val o = pArr.getJSONObject(i)
                          db.savePayment(null, o.optDouble("amount"), o.optString("note"), o.optString("dateTime"), o.optLong("createdMs", System.currentTimeMillis()))
                      }
                  }
              }
              private fun money(v: Double) = String.format(Locale("en", "IN"), "%,.0f", v)
              private fun lp(w: Int, h: Int, bottom: Int = 0) = LinearLayout.LayoutParams(w, h).apply { if (bottom > 0) bottomMargin = bottom }
              private fun toast(s: String) = Toast.makeText(this, s, Toast.LENGTH_SHORT).show()
          }
          KTEOF

      - name: Build Debug APK
        run: |
          PROJECT_DIR=$(dirname "$(find . -maxdepth 5 \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) | head -n 1)")
          printf 'allprojects {\n  tasks.configureEach { t ->\n    if (t.hasProperty("kotlinOptions")) { t.kotlinOptions.jvmTarget = "1.8" }\n  }\n}\n' > /tmp/fix-jvm.gradle
          cd "$PROJECT_DIR"
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --init-script /tmp/fix-jvm.gradle
          else
            gradle assembleDebug --init-script /tmp/fix-jvm.gradle
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FurnitureHisab-APK
          path: "**/build/outputs/apk/debug/*.apk"
